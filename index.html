<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lanternmoss — a tiny cozy planet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Grandstander (display) + Nunito (body): see docs/typography.md -->
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="src/errorOverlay.js"></script>
<script type="module" src="src/main.js"></script>
</head>
<body class="menu">
<div id="hint">
  <div class="full"><b>✦ Lanternmoss</b> <span class="hide-tip"></span><div id="hint-keys"></div></div>
  <div class="mini"></div>
</div>
<div id="compass"><div class="track"></div><i class="notch"></i></div>
<div id="markers"></div>
<div id="lowhp"></div>
<div id="ebars"></div>
<div id="reticle"></div>
<div id="aimhint"></div>
<div id="hurt"></div>
<div id="combat">
  <div id="center">
    <div id="status"></div>
    <div id="heldname"></div>
    <div class="vitals">
      <div class="bar hp"><b></b><i></i><span><em>HP</em><strong></strong></span></div>
      <div class="lvl"><small>LV</small><b></b></div>
      <div class="bar mp"><b></b><i></i><span><em></em><strong></strong></span></div>
    </div>
    <div class="bar xp"><i></i><span><em>XP</em><strong></strong></span></div>
    <div id="hotbar"></div>
  </div>
  <div id="skills"><div id="spells"></div></div>
</div>
<div id="tip"></div>
<div id="hud"></div>
<div id="prompt"></div>
<div id="dialog"><div id="dlg-face"></div><div id="dlg-name"></div><div id="dlg-text"></div>
  <div id="dlg-choices"><button class="yes"></button><button class="no"></button></div><div id="dlg-next"></div></div>
<div id="challenge"></div>
<div id="bossbar"><div class="bn"></div><div class="bb"><b></b><i></i><div class="ticks"></div><span class="pct"></span></div></div>
<div id="fade"></div>
<div id="cresult"></div>
<div id="inventory">
  <div class="inv-head"><b>✦ Bag</b><span class="inv-count"></span><button class="inv-close" type="button">✕</button></div>
  <div class="inv-body"><div class="inv-grid"></div><div class="inv-detail"></div></div>
  <div class="inv-actions"><button class="inv-use" type="button">Use</button><button class="inv-drop" type="button">Drop</button><span class="inv-msg"></span></div>
  <div class="inv-hint"></div>
</div>
<div id="toast"></div>
<div id="pause" class="modal"></div>
<div id="shop" class="modal"></div>
<div id="petmenu"></div>
<div id="title">
  <div class="logo"><h1>Lanternmoss</h1><p>a tiny cozy planet of lanterns, moss &amp; friendly critters</p></div>
  <div class="tmenu">
    <button type="button" class="primary" data-act="play">Play</button>
    <button type="button" data-act="settings">Settings</button>
    <button type="button" data-act="journal">Journal</button>
    <button type="button" data-act="controls">Controls</button>
    <button type="button" data-act="credits">Credits</button>
  </div>
  <div class="campaign"></div>
  <div class="keys">Enter to play · ↑ ↓ to choose</div>
</div>
<div id="start" style="display:none">
  <button type="button" class="back" id="selback">◀ Back</button>
  <h2 id="selhead">Choose your hero</h2>
  <div id="cards" class="sel-cards"></div>
  <div id="hero-detail" class="sel-detail"></div>
  <div id="pet-cards" class="sel-cards"></div>
  <div id="pet-detail" class="sel-detail"></div>
  <div class="drag-hint">⟲ drag to turn</div>
  <div class="go disabled" id="go">Choose your hero</div>
  <div class="keys" id="selkeys">← → or click to choose · drag to turn · Enter for the pet · Esc back</div>
</div>
<div id="err"></div>
</body>
</html>
